---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-controller
  namespace: code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server-controller
  template:
    metadata:
      labels:
        app: code-server-controller
    spec:
      serviceAccountName: code-server-controller
      containers:
      - name: controller
        image: mehdino123/code-server-controller
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: code-server-controller
  namespace: code-server
spec:
  selector:
    app: code-server-controller
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP